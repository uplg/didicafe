[package]
name = "didicafe"
version = "1.0.1"
edition = "2024"
description = "Captive portal daemon for time-limited WiFi access"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Templates
askama = "0.16"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Auth & crypto
rand = "0.10"
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"

# TLS (admin HTTPS listener)
# rustls-pki-types replaces the unmaintained rustls-pemfile (RUSTSEC-2025-0134).
# The repo was archived Aug 2025; PEM parsing is now part of rustls-pki-types 1.9+.
tokio-rustls = "0.26"
rustls-pki-types = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Cancellation
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = "z"     # Optimize for size (embedded target)
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary, no unwinding

[profile.dev]
opt-level = 0       # No optimization for faster builds
debug = true        # Include debug symbols

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3"
