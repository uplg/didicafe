{% extends "base.html" %}

{% block title %}{{ cafe_name }}{% endblock %}
{% block theme_css %}{{ theme_css }}{% endblock %}

{% block body %}
<main class="container" role="main">
    <div class="card">
        <h1 data-i18n="privacy.title"></h1>

        <div class="privacy-content">
            <p data-i18n="privacy.intro"></p>

            <h2 data-i18n="privacy.controller_title"></h2>
            <p data-i18n="privacy.controller"></p>

            <h2 data-i18n="privacy.data_title"></h2>
            <ul>
                <li data-i18n="privacy.data_mac"></li>
                <li data-i18n="privacy.data_ip"></li>
                <li data-i18n="privacy.data_session"></li>
            </ul>

            <h2 data-i18n="privacy.data_not_title"></h2>
            <ul>
                <li data-i18n="privacy.data_not_browsing"></li>
                <li data-i18n="privacy.data_not_content"></li>
                <li data-i18n="privacy.data_not_identity"></li>
            </ul>

            <h2 data-i18n="privacy.legal_title"></h2>
            <p data-i18n="privacy.legal"></p>

            <h2 data-i18n="privacy.retention_title"></h2>
            <p data-i18n="privacy.retention"></p>

            <h2 data-i18n="privacy.rights_title"></h2>
            <p data-i18n="privacy.rights"></p>
            <ul>
                <li data-i18n="privacy.right_access"></li>
                <li data-i18n="privacy.right_erasure"></li>
                <li data-i18n="privacy.right_object"></li>
            </ul>
            <p data-i18n="privacy.rights_contact"></p>
            <p data-i18n="privacy.complaint"></p>

            <h2 data-i18n="privacy.security_title"></h2>
            <p data-i18n="privacy.security"></p>
        </div>

        <div class="mt-lg text-center">
            <a href="/portal" class="btn btn--outline" data-i18n="privacy.back"></a>
        </div>
    </div>
</main>
{% endblock %}
