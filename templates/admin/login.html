{% extends "../base.html" %}

{% block title %}DidiCafe Admin{% endblock %}

{% block body %}
<main class="container" role="main">
    <div class="card">
        {% include "../partials/brand.html" %}
        {% include "../partials/lang_switcher.html" %}

        {% if let Some(err) = error %}
        <div class="alert alert--error" role="alert" data-i18n="admin.login.error">{{ err }}</div>
        {% endif %}

        <form method="post" action="/admin/login" aria-label="Admin login">
            <div class="form-group">
                <label for="username" data-i18n="admin.login.username">Anarana</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                    aria-required="true"
                >
            </div>
            <div class="form-group">
                <label for="password" data-i18n="admin.login.password">Teny miafina</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                    aria-required="true"
                >
            </div>
            <button type="submit" class="btn btn--primary" data-i18n="admin.login.submit">
                Hiditra
            </button>
        </form>
    </div>
</main>
{% endblock %}
