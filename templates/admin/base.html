<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ cafe_name }} Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>{{ theme_css }}</style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="nav" role="navigation" aria-label="Admin navigation">
        <div class="nav-brand">
            <div class="nav-brand-icon" aria-hidden="true">{{ cafe_name.chars().next().unwrap_or('D') }}</div>
            <span>{{ cafe_name }}</span>
        </div>
        <ul class="nav-links">
            <li><a href="/admin"{% if current_page == "dashboard" %} class="active"{% endif %} data-i18n="admin.nav.dashboard"></a></li>
            <li><a href="/admin/manage"{% if current_page == "manage" %} class="active"{% endif %} data-i18n="admin.manage.title"></a></li>
            <li><a href="/admin/audit"{% if current_page == "audit" %} class="active"{% endif %} data-i18n="admin.nav.audit"></a></li>
            <li><a href="/admin/settings"{% if current_page == "settings" %} class="active"{% endif %} data-i18n="admin.nav.settings"></a></li>
            <li>
                <form method="post" action="/admin/logout" style="display:inline">
                    <button type="submit" class="btn btn--outline btn--sm" data-i18n="admin.nav.logout"></button>
                </form>
            </li>
            <li>
                <div class="lang-switcher">
                    <button type="button" class="lang-btn" data-lang="mg">MG</button>
                    <button type="button" class="lang-btn" data-lang="fr">FR</button>
                    <button type="button" class="lang-btn" data-lang="en">EN</button>
                </div>
            </li>
        </ul>
    </nav>

    <div class="container container--wide">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/i18n.js"></script>
    <script src="/static/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
