# Only listen on WiFi interface
interface=wlan0
bind-interfaces

# DHCP range
dhcp-range=10.10.0.100,10.10.0.250,255.255.255.0,12h

# Gateway and DNS
dhcp-option=3,10.10.0.1
dhcp-option=6,10.10.0.1

# Upstream DNS
server=8.8.8.8
server=1.1.1.1

# RFC 8910: advertise the CAPPORT API URL via DHCPv4 option 114.
# MUST point to the CAPPORT JSON API (RFC 8908), not the HTML portal page —
# clients that support CAPPORT will discover the portal URL from the API
# response's `user-portal-url` field.
# When `server.port = 80`, drop the `:8080` suffix.
#
# Domain MUST NOT end in `.local` — iOS resolves `.local` only via mDNS,
# so `.local` URLs are unreachable from iPhones without an mDNS responder.
dhcp-option=114,http://wifi.didicafe:8080/api/captive

# RFC 8910 §2.2 also defines DHCPv6 option 103 for IPv6 clients.
# Uncomment when IPv6 is enabled on the LAN.
# dhcp-option=option6:103,http://wifi.didicafe:8080/api/captive

# Logging
log-dhcp
