#!/usr/sbin/nft -f

flush ruleset

table inet didicafe {

    # Authenticated clients -- MAC+IP pairs with per-element timeout
    # Uses concatenated set so a spoofed MAC from a different IP won't match
    set auth_clients {
        type ether_addr . ipv4_addr
        flags timeout
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Skip everything for authenticated clients (MAC+IP match)
        # Matches both 2.4 GHz (wlan0) and 5 GHz (wlan1)
        iifname { "wlan0", "wlan1" } ether saddr . ip saddr @auth_clients accept

        # Allow DHCP through
        iifname { "wlan0", "wlan1" } udp dport { 67, 68 } accept

        # Redirect all DNS to local dnsmasq (prevent DNS bypass)
        iifname { "wlan0", "wlan1" } udp dport 53 dnat to 10.10.0.1:53
        iifname { "wlan0", "wlan1" } tcp dport 53 dnat to 10.10.0.1:53

        # Redirect HTTP to captive portal
        iifname { "wlan0", "wlan1" } tcp dport 80 dnat to 10.10.0.1:8080
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback
        iifname "lo" accept

        # Established/related connections
        ct state established,related accept

        # Allow DHCP on WiFi interfaces (dual-band)
        iifname { "wlan0", "wlan1" } udp dport { 67, 68 } accept

        # Allow DNS on WiFi interfaces
        iifname { "wlan0", "wlan1" } udp dport 53 accept
        iifname { "wlan0", "wlan1" } tcp dport 53 accept

        # Allow captive portal web server on WiFi interfaces
        iifname { "wlan0", "wlan1" } tcp dport 8080 accept

        # WARNING: SSH on WAN is exposed to the internet. Remove in production
        # or restrict to specific source IPs. Consider disabling if using CGNAT
        # (Starlink) where the SBC is not directly reachable.
        # iifname "eth0" tcp dport 22 accept

        # Allow DHCP client on WAN
        iifname "eth0" udp sport 67 udp dport 68 accept

        # Drop everything else
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Established/related
        ct state established,related accept

        # Only authenticated clients can forward to internet (MAC+IP match)
        # Matches both WiFi interfaces for dual-band support
        iifname { "wlan0", "wlan1" } oifname "eth0" ether saddr . ip saddr @auth_clients accept

        # Drop unauthenticated
        counter drop
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT for outgoing traffic
        oifname "eth0" masquerade
    }
}
