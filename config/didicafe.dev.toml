[server]
listen = "127.0.0.1"
port = 8080
interface = "lo"

[database]
path = "/Users/leonard/didicafe.dev.db"

[admin]
username = "admin"
password_hash = "$argon2id$v=19$m=16384,t=2,p=1$NythOGtiOGJkNzRQQ3dJNXVma2gwZz09$jize2HIoBnQWvpxf6dTQ5QVFKXGgxr7gcPm+gJepNhw"

[firewall]
