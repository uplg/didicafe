[server]
listen = "10.10.0.1"
port = 8080
# OpenWrt: bridge LAN side. Both WiFi interfaces (phy0-ap0 / phy1-ap0)
# are auto-bridged into br-lan via UCI wireless config.
interfaces = "br-lan"

[database]
# OpenWrt: /var/lib is a symlink to /tmp (tmpfs) — wiped on every reboot!
# Use /srv (f2fs overlay, persistent) for the SQLite database. Make sure
# /etc/sysupgrade.conf includes /srv/didicafe/ so the DB survives sysupgrade.
path = "/srv/didicafe/didicafe.db"

[admin]
username = "admin"
# Argon2id (OWASP recommended) — m=19456 (19 MiB), t=2, p=1
# Generate with: cargo test test_argon2id_hash_and_verify -- --nocapture
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$UmHhUjxRtY3c7xV5M6xDaA$Vwia8SfxfxVLTom4LovEtY8PbJitJYDissghdMfTcSM"
# Optional: restrict admin access to specific networks (CIDR notation).
# If empty or omitted, all IPs are accepted.
# allowed_networks = ["10.10.0.0/24"]

[portal]
domain = "wifi.didicafe"
admin_domain = "admin.wifi.didicafe"
cafe_name = "DidiCafe"
# welcome_message = "Tongasoa! Bienvenue!"
theme_color = "#b45309"
# contact_phone = "+261 34 XX XXX XX"
# contact_name = "Didi"
# contact_hours = "Lun-Sam 7h-20h"

[tls]
enabled = true
cert_path = "/opt/didicafe/certs/server.pem"
key_path = "/opt/didicafe/certs/server-key.pem"
admin_port = 443

[firewall]
nft_path = "/usr/sbin/nft"
table_name = "didicafe"
set_name = "auth_clients"

[token]
prefix = "DIDI"
# No 0/O/1/I to avoid human confusion
charset = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
length = 8

[rate_limit]
max_auth_attempts = 5
auth_window_seconds = 60
ban_after_attempts = 10
ban_duration_seconds = 900

[session]
cleanup_interval_seconds = 30
grace_period_seconds = 10
